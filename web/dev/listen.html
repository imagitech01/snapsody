<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The page lives in dev/, but the sample folders are served from the root (samples/<instrument>/): the player
         resolves them against the page's base. -->
    <base href="/" />
    <title>Snapsody listening check</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 16px; max-width: 64rem; }
      h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
      p { margin: 0.25rem 0 0.75rem; }
      button { font: inherit; padding: 0.4em 0.8em; margin: 0 0.4em 0.4em 0; }
      button.stop { font-weight: bold; }
      label { margin-right: 1.25rem; white-space: nowrap; }
      input[type='number'] { font: inherit; width: 5em; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.5rem; margin: 0.75rem 0; }
      .status { font-variant-numeric: tabular-nums; margin: 0.5rem 0; min-height: 1.4em; }
      .error { color: #b00020; white-space: pre-wrap; }
      @media (prefers-color-scheme: dark) { .error { color: #ff8a80; } }
      .table { overflow-x: auto; }
      table { border-collapse: collapse; }
      th, td { text-align: left; padding: 0.35rem 0.6rem 0.1rem 0; vertical-align: top; border-top: 1px solid #8884; }
      .tag { font-size: 0.75rem; opacity: 0.7; margin-left: 0.4em; }
      .hints { font-size: 0.85rem; opacity: 0.8; padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <div id="listen"></div>
    <script type="module" src="/dev/listen.tsx"></script>
  </body>
</html>
