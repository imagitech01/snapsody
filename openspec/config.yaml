schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  tasks:
    - "Every verify step names its layer (quick or browser, see docs/testing.md) and the test that proves it."
    - "New logic is verified by a node unit test on a pure module (web/test/<module>.test.ts), or a Kotlin JVM test for host logic."
    - "A new or redesigned screen updates or adds its journey test in web/test/ui/; one journey per main flow."
    - "A UI task is checked by eye in the app in browser-dev (npm run dev) at 360 × 780, in English (docs/testing.md, \"Checking a screen by eye\"). The Figma design is finished: tasks do not name Figma frames or add to docs/design/deviations.md."
    - "By-ear and by-eye checks are named as manual."
    - "The device smoke test (make test-device) runs once, before archive, on the emulator. A manual check on a real phone is named only for the camera, the scanner, GPU speed, or by-ear and by-eye checks."
  design:
    - "A new plugin call or event (Scanner or Reader) comes with its contract example in fixtures/bridge/."
    - "A change to the stored piece format adds a compatibility folder under web/test/fixtures/stores/."
    - "A change to models, inference or recognition states its own verification; the test layers do not re-test them."
